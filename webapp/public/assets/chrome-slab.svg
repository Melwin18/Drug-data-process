<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="Chrome slab with pooled liquid metal on black">
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.36" stop-color="#b9c0cf"/>
      <stop offset="0.52" stop-color="#5d6576"/>
      <stop offset="0.72" stop-color="#dfe4ee"/>
      <stop offset="1" stop-color="#8a92a3"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#8a92a3"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#5d6576"/>
      <stop offset="0.86" stop-color="#dfe4ee"/>
      <stop offset="1" stop-color="#3a3f4c"/>
    </linearGradient>
    <radialGradient id="slabGlow" cx="0.5" cy="0.55" r="0.66">
      <stop offset="0" stop-color="#e9edf5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0b0c10" stop-opacity="0"/>
    </radialGradient>
    <filter id="slabLiquid" x="-15%" y="-20%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="4" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="60" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="slabSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="14" specularConstant="1.1" specularExponent="30" lighting-color="#ffffff" result="spec">
        <fePointLight x="620" y="200" z="360"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <rect width="1680" height="720" fill="#0b0c10"/>
  <rect width="1680" height="720" fill="url(#slabGlow)"/>

  <g filter="url(#slabLiquid)">
    <rect x="330" y="210" width="1020" height="330" rx="90" fill="url(#slab)" opacity="0.9"/>
    <ellipse cx="560" cy="560" rx="330" ry="118" fill="url(#pool)" opacity="0.92"/>
    <ellipse cx="1180" cy="575" rx="250" ry="92" fill="url(#pool)" opacity="0.85"/>
    <ellipse cx="830" cy="612" rx="180" ry="66" fill="url(#pool)" opacity="0.8"/>
    <ellipse cx="1420" cy="290" rx="112" ry="92" fill="url(#slab)" opacity="0.86"/>
    <ellipse cx="255" cy="300" rx="88" ry="74" fill="url(#slab)" opacity="0.8"/>
  </g>

  <g filter="url(#slabSheen)" opacity="0.82">
    <rect x="330" y="210" width="1020" height="330" rx="90" fill="#5d6576"/>
  </g>

  <rect x="430" y="260" width="520" height="52" rx="26" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="620" cy="545" rx="140" ry="30" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="1180" cy="565" rx="90" ry="20" fill="#ffffff" opacity="0.32"/>
</svg>