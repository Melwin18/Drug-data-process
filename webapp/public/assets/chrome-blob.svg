<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Liquid chrome droplets on black">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#b9c0cf"/>
      <stop offset="0.52" stop-color="#5d6576"/>
      <stop offset="0.7" stop-color="#dfe4ee"/>
      <stop offset="1" stop-color="#8a92a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#e9edf5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0b0c10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.34" cy="0.3" r="0.24">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.008" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="sheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="12" specularConstant="1.1" specularExponent="26" lighting-color="#ffffff" result="spec">
        <fePointLight x="380" y="300" z="320"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="#0b0c10"/>
  <rect width="1000" height="1250" fill="url(#glow)"/>

  <g filter="url(#liquid)">
    <ellipse cx="500" cy="640" rx="330" ry="290" fill="url(#chrome)"/>
    <ellipse cx="300" cy="330" rx="150" ry="132" fill="url(#chrome)" opacity="0.94"/>
    <ellipse cx="735" cy="380" rx="120" ry="108" fill="url(#chrome)" opacity="0.9"/>
    <ellipse cx="640" cy="980" rx="180" ry="118" fill="url(#chrome)" opacity="0.88"/>
    <ellipse cx="330" cy="1010" rx="96" ry="78" fill="url(#chrome)" opacity="0.82"/>
  </g>

  <g filter="url(#sheen)" opacity="0.85">
    <ellipse cx="500" cy="640" rx="330" ry="290" fill="#5d6576"/>
  </g>

  <ellipse cx="430" cy="560" rx="120" ry="88" fill="url(#spec)"/>
  <ellipse cx="270" cy="300" rx="54" ry="42" fill="url(#spec)" opacity="0.8"/>
</svg>