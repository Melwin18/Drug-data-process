<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="Molten chrome wave on black">
  <defs>
    <linearGradient id="waveChrome" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#b9c0cf"/>
      <stop offset="0.5" stop-color="#5d6576"/>
      <stop offset="0.68" stop-color="#dfe4ee"/>
      <stop offset="0.86" stop-color="#8a92a3"/>
      <stop offset="1" stop-color="#3a3f4c"/>
    </linearGradient>
    <radialGradient id="waveGlow" cx="0.62" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#e9edf5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0b0c10" stop-opacity="0"/>
    </radialGradient>
    <filter id="waveLiquid" x="-15%" y="-25%" width="130%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.007" numOctaves="5" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="95" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="waveSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="16" specularConstant="1.05" specularExponent="22" lighting-color="#ffffff" result="spec">
        <fePointLight x="900" y="180" z="420"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <rect width="1680" height="720" fill="#0b0c10"/>
  <rect width="1680" height="720" fill="url(#waveGlow)"/>

  <g filter="url(#waveLiquid)">
    <path d="M-80 470 C 220 300, 420 610, 720 460 C 1010 320, 1200 600, 1480 440 C 1580 385, 1660 360, 1760 380 L 1760 820 L -80 820 Z" fill="url(#waveChrome)"/>
    <path d="M-80 570 C 250 470, 430 680, 760 560 C 1040 460, 1260 660, 1520 540 L 1760 500 L 1760 820 L -80 820 Z" fill="url(#waveChrome)" opacity="0.88"/>
    <ellipse cx="1290" cy="250" rx="150" ry="118" fill="url(#waveChrome)" opacity="0.9"/>
    <ellipse cx="330" cy="200" rx="96" ry="80" fill="url(#waveChrome)" opacity="0.78"/>
    <ellipse cx="870" cy="150" rx="62" ry="54" fill="url(#waveChrome)" opacity="0.7"/>
  </g>

  <g filter="url(#waveSheen)" opacity="0.8">
    <path d="M-80 470 C 220 300, 420 610, 720 460 C 1010 320, 1200 600, 1480 440 L 1760 380 L 1760 820 L -80 820 Z" fill="#5d6576"/>
  </g>

  <ellipse cx="1250" cy="215" rx="60" ry="40" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="320" cy="178" rx="34" ry="22" fill="#ffffff" opacity="0.42"/>
</svg>